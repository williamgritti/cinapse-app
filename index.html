<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="CINAPSE — Catálogo Pessoal de Cinema" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CINAPSE" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>CINAPSE</title>
  </head>
  <body>
    <!-- Leader de contagem (Academy) — some após a carga -->
    <div class="cnp-leader" id="cnp-leader"><div class="cnp-gate"><span class="cnp-x"></span><span class="cnp-num" id="cnp-num">3</span></div></div>
    <!-- Bordas de película (sprockets) — a assinatura; persistem em todas as telas -->
    <div class="cnp-edge cnp-edge-l"><div class="cnp-code">CINAPSE&nbsp;·&nbsp;5247&nbsp;·&nbsp;SAFETY&nbsp;FILM&nbsp;·&nbsp;24·23·22·21·20·19·18&nbsp;·&nbsp;A&nbsp;·&nbsp;CINAPSE&nbsp;·&nbsp;5247&nbsp;·&nbsp;SAFETY&nbsp;FILM&nbsp;·&nbsp;17·16·15·14·13·12&nbsp;·&nbsp;B</div></div>
    <div class="cnp-edge cnp-edge-r"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var n = 3, el = document.getElementById('cnp-num');
        var t = setInterval(function () { n--; if (n < 1) { clearInterval(t); return; } if (el) el.textContent = n; }, 760);
        var leader = document.getElementById('cnp-leader');
        if (leader) setTimeout(function () { leader.style.display = 'none'; }, 3000);
      })();
    </script>
  </body>
